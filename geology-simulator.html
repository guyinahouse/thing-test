<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoSim: Climate & Temperature</title>
    <style>
        body {
            background-color: #0f1115;
            color: #cfd8dc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* --- UI LAYOUT --- */
        header {
            width: 100%;
            background: #191c24;
            padding: 8px 0;
            text-align: center;
            border-bottom: 1px solid #2f3640;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1 { margin: 0; font-size: 1.1rem; color: #90a4ae; text-transform: uppercase; letter-spacing: 2px; }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #232730;
            padding: 4px 12px;
            border-radius: 16px;
            border: 1px solid #37474f;
        }

        .temp-slider-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #b0bec5;
        }

        /* Temperature Slider Styling */
        input[type=range].temp-slider {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: linear-gradient(90deg, #4fc3f7 0%, #fff 50%, #ff5722 100%);
            border-radius: 3px;
            cursor: pointer;
        }
        input[type=range].temp-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid #555;
            margin-top: -5px;
        }

        .toolbar {
            display: flex;
            gap: 6px;
            margin: 10px 0;
            flex-wrap: wrap;
            justify-content: center;
            background: #191c24;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #2f3640;
            max-width: 95vw;
        }

        button {
            padding: 6px 10px;
            border: 1px solid #37474f;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            background-color: #263238;
            color: #b0bec5;
            transition: all 0.2s;
            font-weight: 500;
        }

        button:hover { background-color: #37474f; color: #fff; transform: translateY(-1px); }
        button.active { 
            background-color: #546e7a; 
            color: #fff; 
            border-color: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* Material Colors in UI */
        .btn-bedrock { border-bottom: 3px solid #6b6b6b; }
        .btn-sediment { border-bottom: 3px solid #e6c229; }
        .btn-water { border-bottom: 3px solid #4da6ff; }
        .btn-magma { border-bottom: 3px solid #ff3c00; }
        .btn-ice { border-bottom: 3px solid #aaddff; }
        .btn-snow { border-bottom: 3px solid #fff; }
        .btn-seed { border-bottom: 3px solid #76ff03; }
        .btn-salt { border-bottom: 3px solid #f8bbd0; }

        .game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #37474f;
        }
        
        canvas {
            background-color: #000;
            image-rendering: pixelated; 
            cursor: crosshair;
            display: block;
        }

        /* --- EDUCATIONAL INFO BOX --- */
        #infoPanel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            background: rgba(20, 25, 30, 0.95);
            border-left: 4px solid #4da6ff;
            padding: 15px;
            border-radius: 4px;
            color: #eee;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            z-index: 10;
        }

        #infoTitle {
            font-weight: bold;
            color: #4da6ff;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: block;
        }

        #infoDesc { font-size: 0.9rem; line-height: 1.4; color: #ccc; }

        .status-bar {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.8rem;
            color: #546e7a;
            align-items: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>GeoSim</h1>
        
        <div class="control-group temp-slider-container">
            <span>Temp: <span id="tempDisplay" style="width: 40px; display:inline-block; text-align:right;">20</span>°C</span>
            <input type="range" min="-20" max="120" value="20" class="temp-slider" id="tempSlider" oninput="updateTemp(this.value)">
        </div>

        <div class="control-group">
            <input type="checkbox" id="rainToggle"> <label for="rainToggle" style="font-size: 0.8rem; cursor:pointer;">Precipitation</label>
        </div>
    </header>

    <div class="toolbar">
        <button class="btn-bedrock active" onclick="setMaterial(1)">Bedrock</button>
        <button class="btn-sediment" onclick="setMaterial(2)">Sediment</button>
        <button class="btn-water" onclick="setMaterial(3)">Water</button>
        <button class="btn-magma" onclick="setMaterial(4)">Magma</button>
        <div style="width:1px; background:#37474f; margin:0 2px;"></div>
        <button class="btn-ice" onclick="setMaterial(8)">Ice</button>
        <button class="btn-snow" onclick="setMaterial(12)">Snow</button>
        <button class="btn-salt" onclick="setMaterial(13)">Salt</button>
        <button class="btn-seed" onclick="setMaterial(10)">Seed</button>
        <div style="width:1px; background:#37474f; margin:0 2px;"></div>
        <button onclick="setMaterial(0)" style="color:#ff5252">Eraser</button>
        <button onclick="clearGrid()">Reset</button>
    </div>

    <div class="game-container">
        <canvas id="simCanvas"></canvas>
        
        <!-- Educational Overlay -->
        <div id="infoPanel">
            <span id="infoTitle">GEOLOGICAL EVENT</span>
            <span id="infoDesc">Description goes here...</span>
        </div>
    </div>

    <div class="status-bar">
        <span>Brush: <input type="range" min="1" max="8" value="3" oninput="brushSize=parseInt(this.value)"></span>
        <span id="fps">FPS: 60</span>
    </div>

<script>
    // --- EDUCATIONAL DATA ---
    const GEO_EVENTS = {
        'erosion': {
            title: "Erosion",
            desc: "Water wears down hard Bedrock, creating loose Sediment.",
            color: "#e6c229"
        },
        'soil_formation': {
            title: "Pedogenesis (Soil Formation)",
            desc: "Dry Sediment absorbs water to become Wet Sediment (Soil). This creates a medium where plants can grow.",
            color: "#5d4037"
        },
        'germination': {
            title: "Germination",
            desc: "A Seed planted in damp Soil begins to grow into a plant.",
            color: "#76ff03"
        },
        'lithification': {
            title: "Lithification",
            desc: "Deep pressure turns Sediment into Sandstone.",
            color: "#a1887f"
        },
        'volcanism': {
            title: "Crystallization",
            desc: "Magma cools into Basalt rock.",
            color: "#546e7a"
        },
        'melting': {
            title: "Melting",
            desc: "Extreme heat melts rock/ice back into liquid form.",
            color: "#ff3c00"
        },
        'freezing': {
            title: "Freezing",
            desc: "Low temperatures cause liquid Water to solidify into Ice.",
            color: "#aaddff"
        },
        'evaporation': {
            title: "Evaporation",
            desc: "Water turns to steam. Heat increases this rate.",
            color: "#4da6ff"
        },
        'boiling': {
            title: "Boiling",
            desc: "Temperatures above 100°C cause Water to instantly turn into Steam.",
            color: "#ff5722"
        },
        'salinization': {
            title: "Salinization",
            desc: "As water evaporates, it leaves behind dissolved minerals (Salt).",
            color: "#f8bbd0"
        }
    };

    let lastEventTime = 0;
    let currentEventKey = null;

    function triggerEvent(key) {
        const now = Date.now();
        const cooldown = (key === currentEventKey) ? 6000 : 3000;
        
        if (now - lastEventTime > cooldown) {
            const info = GEO_EVENTS[key];
            if (!info) return;

            const panel = document.getElementById('infoPanel');
            const title = document.getElementById('infoTitle');
            const desc = document.getElementById('infoDesc');

            title.innerText = info.title;
            title.style.color = info.color;
            panel.style.borderLeftColor = info.color;
            desc.innerText = info.desc;

            panel.style.opacity = 1;
            lastEventTime = now;
            currentEventKey = key;

            setTimeout(() => {
                if (currentEventKey === key && Date.now() - lastEventTime >= 4000) {
                    panel.style.opacity = 0;
                }
            }, 5000);
        }
    }

    // --- SIMULATION CONFIG ---
    const WIDTH = 200;
    const HEIGHT = 150;
    const SCALE = 4;
    
    // --- MATERIALS ---
    const AIR = 0;
    const BEDROCK = 1;
    const SEDIMENT = 2;
    const WATER = 3;
    const MAGMA = 4;
    const BASALT = 5;
    const SANDSTONE = 6;
    const STEAM = 7;
    const ICE = 8;
    const PLANT = 9;   
    const SEED = 10;
    const WET_SEDIMENT = 11;
    const SNOW = 12;
    const SALT = 13;
    const WOOD = 14;

    // --- COLORS ---
    const PALETTE = {
        [AIR]: [10, 10, 15],
        [BEDROCK]: [80, 80, 85],
        [SEDIMENT]: [210, 180, 100],
        [WATER]: [40, 100, 220],
        [MAGMA]: [255, 60, 10],
        [BASALT]: [40, 40, 45],
        [SANDSTONE]: [140, 90, 60],
        [STEAM]: [220, 230, 240],
        [ICE]: [200, 240, 255],
        [PLANT]: [50, 200, 60],
        [SEED]: [160, 255, 50],
        [WET_SEDIMENT]: [101, 67, 33],
        [SNOW]: [250, 250, 255],
        [SALT]: [255, 230, 230],
        [WOOD]: [90, 60, 30]
    };

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    canvas.width = WIDTH * SCALE;
    canvas.height = HEIGHT * SCALE;

    const offCanvas = document.createElement('canvas');
    offCanvas.width = WIDTH;
    offCanvas.height = HEIGHT;
    const offCtx = offCanvas.getContext('2d');
    const imgData = offCtx.createImageData(WIDTH, HEIGHT);

    let cells = new Uint8Array(WIDTH * HEIGHT);
    
    // Input State
    let brushSize = 3;
    let currentMat = BEDROCK;
    let isMouseDown = false;
    let rainEnabled = false;
    let temperature = 20; // Celsius
    let frameCount = 0;

    // --- INPUT HANDLING ---
    function updateTemp(val) {
        temperature = parseInt(val);
        const display = document.getElementById('tempDisplay');
        display.innerText = temperature;
        
        // Visual Feedback for slider text
        if(temperature < 0) display.style.color = "#4fc3f7";
        else if(temperature > 40) display.style.color = "#ff5722";
        else display.style.color = "#b0bec5";
    }

    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        return {
            x: Math.floor(((e.clientX - rect.left) * scaleX) / SCALE),
            y: Math.floor(((e.clientY - rect.top) * scaleY) / SCALE)
        };
    }

    canvas.addEventListener('mousedown', e => { isMouseDown = true; paint(e); });
    window.addEventListener('mouseup', () => isMouseDown = false);
    canvas.addEventListener('mousemove', e => { if (isMouseDown) paint(e); });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    
    document.getElementById('rainToggle').addEventListener('change', (e) => rainEnabled = e.target.checked);

    function setMaterial(m) {
        currentMat = m;
        document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
        const btn = Array.from(document.querySelectorAll('.toolbar button')).find(b => b.getAttribute('onclick').includes(`setMaterial(${m})`));
        if(btn) btn.classList.add('active');
    }

    function clearGrid() {
        cells.fill(AIR);
        generateTerrain();
    }

    function paint(e) {
        const pos = getMousePos(e);
        const mat = (e.button === 2) ? AIR : currentMat;
        for (let y = -brushSize + 1; y < brushSize; y++) {
            for (let x = -brushSize + 1; x < brushSize; x++) {
                if (x*x + y*y < brushSize*brushSize) set(pos.x + x, pos.y + y, mat);
            }
        }
    }

    // --- HELPERS ---
    function get(x, y) {
        if (x < 0 || x >= WIDTH || y < 0 || y >= HEIGHT) return BEDROCK;
        return cells[y * WIDTH + x];
    }
    
    function set(x, y, t) {
        if (x < 0 || x >= WIDTH || y < 0 || y >= HEIGHT) return;
        cells[y * WIDTH + x] = t;
    }

    function isEmpty(x, y) { return get(x, y) === AIR; }

    function generateTerrain() {
        for (let x = 0; x < WIDTH; x++) {
            let h = Math.floor(HEIGHT * 0.75 + Math.sin(x * 0.04) * 15);
            for (let y = h; y < HEIGHT; y++) set(x, y, BEDROCK);
        }
    }

    // --- PHYSICS UPDATE ---
    function update() {
        for (let y = HEIGHT - 1; y >= 0; y--) {
            const dir = Math.random() > 0.5 ? 1 : -1;
            const startX = dir === 1 ? 0 : WIDTH - 1;
            const endX = dir === 1 ? WIDTH : -1;

            for (let x = startX; x !== endX; x += dir) {
                const idx = y * WIDTH + x;
                const type = cells[idx];
                
                if (type === AIR || type === BEDROCK || type === BASALT || type === SANDSTONE || type === WOOD) continue;

                // 1. WEATHER GENERATION
                if (y === 0 && rainEnabled) {
                    if (Math.random() < 0.03) {
                        if (temperature < 0) set(x, y, SNOW);
                        else if (temperature > 100) set(x, y, AIR); // Too hot to rain
                        else set(x, y, WATER);
                    }
                }

                const below = get(x, y + 1);
                
                // 2. WATER DYNAMICS
                if (type === WATER) {
                    // Temperature Check
                    if (temperature < 0) {
                        // Freeze
                        if (Math.random() < 0.02) {
                            set(x, y, ICE);
                            triggerEvent('freezing');
                            continue;
                        }
                    } else if (temperature > 100) {
                        // Boil
                        set(x, y, STEAM);
                        triggerEvent('boiling');
                        continue;
                    }

                    // Movement
                    let moved = false;
                    if (below === AIR || below === SNOW) {
                        set(x, y + 1, WATER); set(x, y, AIR); moved = true;
                    } else if (isEmpty(x - 1, y)) {
                        set(x - 1, y, WATER); set(x, y, AIR); moved = true;
                    } else if (isEmpty(x + 1, y)) {
                        set(x + 1, y, WATER); set(x, y, AIR); moved = true;
                    }

                    if (!moved) {
                        // Erosion
                        const neighbors = [[x,y+1], [x+1,y], [x-1,y]];
                        for (let n of neighbors) {
                            const nt = get(n[0], n[1]);
                            if ((nt === BEDROCK || nt === SANDSTONE) && Math.random() < 0.005) {
                                set(n[0], n[1], SEDIMENT); set(x, y, AIR);
                                triggerEvent('erosion'); break; 
                            }
                            if (nt === SALT && Math.random() < 0.1) set(n[0], n[1], WATER);
                        }
                    }

                    // Evaporation (Rate increases with temperature)
                    let evapChance = 0.001; 
                    if (temperature > 30) evapChance = 0.02;
                    if (temperature > 60) evapChance = 0.1;

                    // Nearby Heat Source boosts evaporation
                    if (get(x, y+1) === MAGMA || get(x, y+1) === BASALT) evapChance += 0.2;

                    if (Math.random() < evapChance) {
                        set(x, y, Math.random() < 0.05 ? SALT : STEAM);
                        if (get(x,y) === SALT) triggerEvent('salinization');
                        else triggerEvent('evaporation');
                    }
                }

                // 3. ICE & SNOW
                else if (type === ICE || type === SNOW) {
                    // Melting
                    if (temperature > 0) {
                        // Warmer = faster melting
                        let meltChance = 0.01 + (temperature * 0.001);
                        // Magma melts instantly
                        if (get(x,y+1) === MAGMA) meltChance = 1.0;
                        
                        if (Math.random() < meltChance) {
                            set(x, y, WATER);
                            triggerEvent('melting');
                        }
                    }

                    // Gravity (Snow only, Ice is static-ish)
                    if (type === SNOW) {
                         if (below === AIR || below === WATER) {
                            set(x, y + 1, SNOW); set(x, y, below===WATER?WATER:AIR);
                        } else if (isEmpty(x - 1, y + 1)) {
                            set(x - 1, y + 1, SNOW); set(x, y, AIR);
                        } else if (isEmpty(x + 1, y + 1)) {
                            set(x + 1, y + 1, SNOW); set(x, y, AIR);
                        }
                    }
                }

                // 4. PLANT LIFE
                else if (type === PLANT) {
                    // Thermal Shock
                    if (temperature > 60 || temperature < -10) {
                        if (Math.random() < 0.05) set(x, y, WOOD); // Die/Dry out
                    }

                    const ground = get(x, y + 1);
                    if (ground === AIR || ground === WATER) {
                        set(x, y + 1, PLANT); set(x, y, AIR); // Fall
                    } else if ((ground === WOOD || ground === PLANT) && Math.random() < 0.02) {
                        // Grow if temp is decent
                        if (temperature > 10 && temperature < 40) {
                            if (get(x, y-1) === AIR) {
                                set(x, y, WOOD); set(x, y-1, PLANT);
                                if (Math.random() > 0.7) {
                                    if (isEmpty(x-1, y)) set(x-1, y, PLANT);
                                    if (isEmpty(x+1, y)) set(x+1, y, PLANT);
                                }
                            }
                        }
                    }
                    if ([MAGMA].includes(get(x, y+1))) set(x,y,AIR);
                }

                // 5. SEEDS
                else if (type === SEED) {
                    if (below === AIR || below === WATER) {
                        set(x, y + 1, SEED); set(x, y, below === WATER ? WATER : AIR);
                    } else if (below === WET_SEDIMENT) {
                        // Germinate only in good temps
                        if (temperature > 5 && temperature < 45 && Math.random() < 0.05) {
                            set(x, y, WOOD); set(x, y-1, PLANT);
                            triggerEvent('germination');
                        }
                    }
                }

                // 6. SEDIMENT
                else if (type === SEDIMENT || type === WET_SEDIMENT || type === SALT) {
                    if (below === AIR || below === WATER) {
                        set(x, y + 1, type); set(x, y, below === WATER ? WATER : AIR);
                    } else if (isEmpty(x - 1, y + 1)) {
                        set(x - 1, y + 1, type); set(x, y, AIR);
                    } else if (isEmpty(x + 1, y + 1)) {
                        set(x + 1, y + 1, type); set(x, y, AIR);
                    } 
                    
                    if (type === SEDIMENT) {
                        const neighbors = [get(x,y-1), get(x,y+1), get(x-1,y), get(x+1,y)];
                        if (neighbors.includes(WATER)) {
                            if (get(x,y-1)===WATER) set(x,y-1,AIR); // Absorb water
                            set(x, y, WET_SEDIMENT);
                            triggerEvent('soil_formation');
                        }
                    }
                    // Drying out
                    if (type === WET_SEDIMENT && temperature > 40 && Math.random() < 0.01) {
                        set(x, y, SEDIMENT); // Dry back to sand
                    }

                    if (Math.random() < 0.001 && type !== SALT) {
                         if (get(x, y-5) === SEDIMENT || get(x, y-5) === WET_SEDIMENT) {
                             set(x, y, SANDSTONE); triggerEvent('lithification');
                         }
                    }
                }

                // 7. MAGMA
                else if (type === MAGMA) {
                    if (below === AIR) {
                        set(x, y + 1, MAGMA); set(x, y, AIR);
                    } else if (isEmpty(x + dir, y)) {
                        set(x + dir, y, MAGMA); set(x, y, AIR);
                    }

                    const neighbors = [[x,y+1], [x,y-1], [x+1,y], [x-1,y]];
                    for (let n of neighbors) {
                        const nt = get(n[0], n[1]);
                        if (nt === BEDROCK || nt === SEDIMENT || nt === SANDSTONE) {
                            if (Math.random() < 0.08) { set(n[0], n[1], MAGMA); triggerEvent('melting'); }
                        } else if (nt === WATER || nt === ICE || nt === SNOW) {
                            set(x, y, BASALT); set(n[0], n[1], STEAM); triggerEvent('volcanism');
                        } else if (nt === AIR && Math.random() < 0.005) {
                            set(x, y, BASALT); triggerEvent('volcanism');
                        }
                    }
                }

                // 8. STEAM
                else if (type === STEAM) {
                    if (Math.random() < 0.05) set(x, y, AIR);
                    else if (isEmpty(x, y - 1)) { set(x, y - 1, STEAM); set(x, y, AIR); }
                    
                    // Condensation (only if cool enough)
                    if (temperature < 100 && y < 20 && Math.random() < 0.01) { 
                        set(x, y, WATER); 
                    }
                }
            }
        }
    }

    // --- RENDER ---
    function draw() {
        const data = imgData.data;
        for (let i = 0; i < cells.length; i++) {
            const type = cells[i];
            const [r, g, b] = PALETTE[type];
            const idx = i * 4;
            
            let noise = 0;
            if (type !== AIR && type !== WATER && type !== STEAM) {
                noise = ((i * 1234.5678) % 25) - 12; 
            } else if (type === WATER) {
                 noise = ((i * 45.67) % 10) - 5;
            }

            data[idx] = Math.max(0, Math.min(255, r + noise));
            data[idx + 1] = Math.max(0, Math.min(255, g + noise));
            data[idx + 2] = Math.max(0, Math.min(255, b + noise));
            data[idx + 3] = 255;
        }
        
        offCtx.putImageData(imgData, 0, 0);
        ctx.drawImage(offCanvas, 0, 0, canvas.width, canvas.height);
    }

    // --- LOOP ---
    let lastMouseX=0, lastMouseY=0;
    document.addEventListener('mousemove', e => {lastMouseX=e.clientX; lastMouseY=e.clientY;});

    function loop() {
        update();
        draw();
        
        const rect = canvas.getBoundingClientRect();
        if (lastMouseX > rect.left && lastMouseX < rect.right && lastMouseY > rect.top && lastMouseY < rect.bottom) {
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const cx = (lastMouseX - rect.left) * scaleX;
            const cy = (lastMouseY - rect.top) * scaleY;
            ctx.strokeStyle = "rgba(255,255,255,0.4)";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(cx, cy, brushSize * SCALE, 0, Math.PI*2);
            ctx.stroke();
        }

        frameCount++;
        requestAnimationFrame(loop);
    }

    setInterval(() => { document.getElementById('fps').innerText = `FPS: ${frameCount}`; frameCount = 0; }, 1000);
    
    generateTerrain();
    loop();

</script>
</body>
</html>

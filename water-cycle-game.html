<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Cycle — Biome Sim</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');

  :root {
    --sky-day: #87ceeb;
    --sky-hot: #f4a261;
    --sky-storm: #4a5568;
    --ground: #8B6914;
    --ui-bg: rgba(0,0,0,0.55);
    --gold: #f4d03f;
    --teal: #48cae4;
    --red: #e63946;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Crimson Pro', serif;
    background: #000;
    overflow: hidden;
    user-select: none;
  }

  #game-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  #sky {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 62%;
    transition: background 1.5s ease;
    overflow: hidden;
  }

  #ground-layer {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 38%;
    overflow: hidden;
  }

  /* Biome selector */
  #biome-bar {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 6px;
    z-index: 100;
    background: var(--ui-bg);
    padding: 6px 12px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,0.15);
  }

  .biome-btn {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.05em;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.25);
    background: transparent;
    color: #ccc;
    cursor: pointer;
    transition: all 0.2s;
  }
  .biome-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .biome-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

  /* Stats HUD */
  #hud {
    position: absolute;
    top: 52px; left: 12px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .stat-row {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--ui-bg);
    border-radius: 20px;
    padding: 4px 10px;
    border: 1px solid rgba(255,255,255,0.1);
    min-width: 170px;
  }

  .stat-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: #aaa;
    text-transform: uppercase;
    width: 64px;
    flex-shrink: 0;
  }

  .stat-bar-bg {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.1);
    border-radius: 3px;
    overflow: hidden;
  }

  .stat-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .fill-blue  { background: linear-gradient(90deg, #48cae4, #0096c7); }
  .fill-white { background: linear-gradient(90deg, #c8d6e5, #fff); }
  .fill-green { background: linear-gradient(90deg, #40916c, #95d5b2); }
  .fill-red   { background: linear-gradient(90deg, #e63946, #ff6b6b); }

  .stat-val {
    font-size: 11px;
    color: #eee;
    width: 28px;
    text-align: right;
  }

  /* Info box */
  #info-box {
    position: absolute;
    bottom: 12px; right: 12px;
    z-index: 100;
    background: var(--ui-bg);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 14px;
    max-width: 220px;
    font-size: 12px;
    color: #bbb;
    line-height: 1.5;
  }

  #info-box strong {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    color: var(--gold);
    display: block;
    margin-bottom: 4px;
    letter-spacing: 0.08em;
  }

  /* Cycle phase label */
  #phase-label {
    position: absolute;
    top: 52px; right: 12px;
    z-index: 100;
    font-family: 'Cinzel', serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--gold);
    background: var(--ui-bg);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid rgba(244,208,63,0.3);
  }

  /* Sun */
  #sun {
    position: absolute;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff7a1 0%, #ffd60a 50%, #f77f00 100%);
    box-shadow: 0 0 30px 10px rgba(255,200,0,0.5);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.3s;
    z-index: 50;
  }
  #sun:hover { transform: scale(1.12); box-shadow: 0 0 50px 20px rgba(255,180,0,0.7); }
  #sun:active { transform: scale(0.95); }
  #sun.hot { box-shadow: 0 0 70px 30px rgba(255,80,0,0.8); }

  /* Clouds container */
  #clouds-layer {
    position: absolute;
    top: 0; left: 0; right: 0;
    bottom: 0;
    pointer-events: none;
  }

  .cloud {
    position: absolute;
    cursor: pointer;
    pointer-events: all;
    transition: opacity 0.5s;
  }

  .cloud svg { display: block; }
  .cloud:hover svg ellipse { filter: brightness(1.1); }

  .rain-drop {
    position: absolute;
    width: 2px;
    border-radius: 1px;
    pointer-events: none;
    animation: rain-fall linear forwards;
  }

  @keyframes rain-fall {
    0%   { opacity: 0.9; }
    100% { transform: translateY(var(--drop-dist)); opacity: 0; }
  }

  /* Tree / vegetation */
  .tree-el, .cactus-el, .grass-el, .snowpine-el, .palm-el {
    position: absolute;
    bottom: 0;
    pointer-events: none;
    transition: opacity 0.6s;
  }

  /* Water ripple effect on rain click */
  .ripple {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: ripple-out 0.6s ease-out forwards;
    border: 2px solid rgba(100,200,255,0.7);
  }

  @keyframes ripple-out {
    0%   { transform: scale(0); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
  }

  /* Vapor particles */
  .vapor {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    pointer-events: none;
    animation: vapor-rise linear forwards;
  }

  @keyframes vapor-rise {
    0%   { transform: translateY(0) scale(1); opacity: 0.7; }
    100% { transform: translateY(var(--rise)) scale(0.3); opacity: 0; }
  }

  /* Flash overlay for storms */
  #lightning-flash {
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    pointer-events: none;
    z-index: 200;
    transition: opacity 0.05s;
  }

  /* Tooltip */
  #tooltip {
    position: absolute;
    background: rgba(0,0,0,0.75);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 11px;
    color: #eee;
    pointer-events: none;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.2s;
  }

  /* Biome ground gradients */
  .ground-tropical  { background: linear-gradient(180deg, #5a3e1b 0%, #2d6a4f 100%); }
  .ground-desert    { background: linear-gradient(180deg, #c9a84c 0%, #8B6914 100%); }
  .ground-temperate { background: linear-gradient(180deg, #6b4226 0%, #4a7c59 100%); }
  .ground-tundra    { background: linear-gradient(180deg, #b0c4de 0%, #778899 100%); }
  .ground-savanna   { background: linear-gradient(180deg, #c2813a 0%, #7a5c2e 100%); }

  /* Sparkle for sun click */
  .sparkle {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ffd60a;
    pointer-events: none;
    animation: sparkle-out 0.5s ease-out forwards;
  }
  @keyframes sparkle-out {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: translate(var(--sx), var(--sy)) scale(0); opacity: 0; }
  }

  #scroll-hint {
    position: absolute;
    bottom: 12px; left: 50%;
    transform: translateX(-50%);
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.3);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="game-wrap">
  <div id="sky"></div>
  <div id="ground-layer"></div>
  <div id="clouds-layer"></div>
  <div id="sun"></div>
  <div id="lightning-flash"></div>
  <div id="tooltip"></div>

  <!-- Biome selector -->
  <div id="biome-bar">
    <button class="biome-btn active" data-biome="temperate">🌲 Temperate</button>
    <button class="biome-btn" data-biome="tropical">🌴 Tropical</button>
    <button class="biome-btn" data-biome="desert">🌵 Desert</button>
    <button class="biome-btn" data-biome="tundra">❄️ Tundra</button>
    <button class="biome-btn" data-biome="savanna">🦁 Savanna</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="stat-row">
      <span class="stat-label">Moisture</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-blue" id="bar-moisture" style="width:50%"></div></div>
      <span class="stat-val" id="val-moisture">50</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Vapor</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-white" id="bar-vapor" style="width:20%"></div></div>
      <span class="stat-val" id="val-vapor">20</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Cloud</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-white" id="bar-cloud" style="width:0%"></div></div>
      <span class="stat-val" id="val-cloud">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Heat</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-red" id="bar-heat" style="width:30%"></div></div>
      <span class="stat-val" id="val-heat">30</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Flora</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill fill-green" id="bar-flora" style="width:0%"></div></div>
      <span class="stat-val" id="val-flora">0</span>
    </div>
  </div>

  <!-- Phase label -->
  <div id="phase-label">☁️ Evaporation</div>

  <!-- Info box -->
  <div id="info-box">
    <strong>HOW TO PLAY</strong>
    ☀️ Click the <b>Sun</b> to add heat — evaporates moisture into vapor.<br><br>
    ☁️ Click a <b>Cloud</b> over land to rain — restores moisture &amp; grows trees.<br><br>
    🌍 Switch <b>Biomes</b> above for different conditions.
  </div>

  <div id="scroll-hint">WATER CYCLE SIMULATOR</div>
</div>

<script>
// ===== STATE =====
const state = {
  moisture: 50,    // 0-100 soil moisture
  vapor: 20,       // 0-100 atmospheric vapor
  cloud: 0,        // 0-100 cloud coverage
  heat: 30,        // 0-100 temperature
  flora: 0,        // tree count ratio 0-100
  biome: 'temperate',
  phase: 'evaporation',
  tick: 0,
  trees: [],       // { el, alive, x, age }
  clouds: [],      // { el, x, speed, size, rain }
  stormMode: false,
};

// ===== BIOME CONFIGS =====
const BIOMES = {
  temperate: {
    label: '🌲 Temperate Forest',
    skyColors: { cool:'#87ceeb', warm:'#ffa94d', hot:'#ff7b3a', storm:'#4a5568' },
    groundClass: 'ground-temperate',
    evapRate: 1.0,   // how fast moisture evaporates per heat unit
    rainEff: 1.0,    // how much rain restores moisture
    maxTrees: 12,
    treeType: 'tree',
    baseMoisture: 50,
    baseHeat: 30,
    description: 'Balanced rainfall & mild temperatures. Easy start.',
  },
  tropical: {
    label: '🌴 Tropical Rainforest',
    skyColors: { cool:'#a8dadc', warm:'#f4a261', hot:'#e76f51', storm:'#264653' },
    groundClass: 'ground-tropical',
    evapRate: 1.4,
    rainEff: 1.3,
    maxTrees: 15,
    treeType: 'palm',
    baseMoisture: 70,
    baseHeat: 55,
    description: 'Hot & humid. Rapid evaporation fuels intense storms.',
  },
  desert: {
    label: '🌵 Desert',
    skyColors: { cool:'#f6d860', warm:'#f4a261', hot:'#e63946', storm:'#7f4f24' },
    groundClass: 'ground-desert',
    evapRate: 2.2,
    rainEff: 0.6,
    maxTrees: 6,
    treeType: 'cactus',
    baseMoisture: 10,
    baseHeat: 70,
    description: 'Extreme heat drains moisture fast. Rare but heavy rain.',
  },
  tundra: {
    label: '❄️ Tundra',
    skyColors: { cool:'#d8e2dc', warm:'#ced4da', hot:'#adb5bd', storm:'#495057' },
    groundClass: 'ground-tundra',
    evapRate: 0.4,
    rainEff: 0.8,
    maxTrees: 8,
    treeType: 'snowpine',
    baseMoisture: 40,
    baseHeat: 10,
    description: 'Cold suppresses evaporation. Slow, resilient ecosystem.',
  },
  savanna: {
    label: '🦁 Savanna',
    skyColors: { cool:'#f4d35e', warm:'#f4a261', hot:'#ee6c4d', storm:'#83c5be' },
    groundClass: 'ground-savanna',
    evapRate: 1.7,
    rainEff: 0.9,
    maxTrees: 10,
    treeType: 'tree',
    baseMoisture: 25,
    baseHeat: 55,
    description: 'Wet & dry seasons alternate. Survive the drought!',
  },
};

// ===== DOM REFERENCES =====
const sky      = document.getElementById('sky');
const groundEl = document.getElementById('ground-layer');
const cloudsEl = document.getElementById('clouds-layer');
const sunEl    = document.getElementById('sun');
const flash    = document.getElementById('lightning-flash');
const phaseEl  = document.getElementById('phase-label');
const tooltip  = document.getElementById('tooltip');

// ===== INIT =====
function init() {
  applyBiome('temperate');
  positionSun();
  spawnInitialTrees();
  spawnCloud();
  gameLoop();
}

function applyBiome(name) {
  const b = BIOMES[name];
  state.biome = name;
  state.moisture = b.baseMoisture;
  state.heat = b.baseHeat;

  groundEl.className = '';
  groundEl.classList.add(b.groundClass);

  // Clear trees
  state.trees.forEach(t => t.el.remove());
  state.trees = [];
  state.clouds.forEach(c => c.el.remove());
  state.clouds = [];
  state.cloud = 0;
  state.vapor = 20;
  state.flora = 0;

  updateSkyColor();
  spawnInitialTrees();
  updateHUD();
}

// ===== SUN =====
function positionSun() {
  sunEl.style.top = '8%';
  sunEl.style.left = '78%';
}

sunEl.addEventListener('click', (e) => {
  const b = BIOMES[state.biome];
  // Heat boost
  state.heat = Math.min(100, state.heat + 12);
  // Evaporate moisture → vapor
  const evap = Math.min(state.moisture, 8 * b.evapRate);
  state.moisture = Math.max(0, state.moisture - evap);
  state.vapor    = Math.min(100, state.vapor + evap * 1.5);

  // Check cloud forming
  if (state.vapor > 60) {
    state.cloud = Math.min(100, state.cloud + 8);
    if (state.clouds.length < 4) spawnCloud();
  }

  sunEl.classList.add('hot');
  setTimeout(() => sunEl.classList.remove('hot'), 1000);

  // Sparkles
  for (let i = 0; i < 8; i++) {
    const sp = document.createElement('div');
    sp.className = 'sparkle';
    const angle = (Math.PI * 2 * i) / 8;
    const dist = 40 + Math.random() * 30;
    sp.style.setProperty('--sx', (Math.cos(angle)*dist)+'px');
    sp.style.setProperty('--sy', (Math.sin(angle)*dist)+'px');
    const rect = sunEl.getBoundingClientRect();
    sp.style.left = (rect.left + rect.width/2 - 3) + 'px';
    sp.style.top  = (rect.top  + rect.height/2 - 3) + 'px';
    sp.style.position = 'fixed';
    document.body.appendChild(sp);
    setTimeout(() => sp.remove(), 500);
  }

  // Vapor particles
  emitVapor(state.moisture > 20 ? 6 : 2);
  updateHUD();
});

function emitVapor(count) {
  for (let i = 0; i < count; i++) {
    const v = document.createElement('div');
    v.className = 'vapor';
    const size = 6 + Math.random() * 10;
    v.style.width  = size+'px';
    v.style.height = size+'px';
    v.style.left   = (10 + Math.random() * 80) + '%';
    v.style.bottom = (38 + Math.random() * 10) + '%';
    const rise = -(80 + Math.random() * 120);
    v.style.setProperty('--rise', rise+'px');
    const dur = 1.5 + Math.random() * 1.5;
    v.style.animationDuration = dur+'s';
    v.style.animationDelay    = (Math.random() * 0.5)+'s';
    document.getElementById('game-wrap').appendChild(v);
    setTimeout(() => v.remove(), (dur + 0.5) * 1000);
  }
}

// ===== SKY COLOR =====
function updateSkyColor() {
  const b = BIOMES[state.biome];
  const c = b.skyColors;
  let color;
  if (state.stormMode)       color = c.storm;
  else if (state.heat > 70)  color = c.hot;
  else if (state.heat > 45)  color = c.warm;
  else                       color = c.cool;

  // Darken based on cloud coverage
  const alpha = state.cloud / 100 * 0.35;
  sky.style.background = `linear-gradient(180deg, ${color} 0%, rgba(0,0,0,${alpha}) 100%), ${color}`;
}

// ===== CLOUDS =====
function spawnCloud() {
  const b = BIOMES[state.biome];
  const wrapper = document.createElement('div');
  wrapper.className = 'cloud';

  const isStorm = state.cloud > 70 || state.stormMode;
  const size = 80 + Math.random() * 80;
  const top  = 5 + Math.random() * 35;
  const startX = -size;

  wrapper.style.top   = top + '%';
  wrapper.style.left  = startX + 'px';
  wrapper.style.width = size + 'px';

  const fill  = isStorm ? '#636e72' : `rgba(255,255,255,${0.7 + Math.random()*0.3})`;
  const fill2 = isStorm ? '#4a5568' : 'rgba(220,240,255,0.9)';

  wrapper.innerHTML = `<svg viewBox="0 0 120 60" width="${size}" height="${size*0.5}" xmlns="http://www.w3.org/2000/svg">
    <ellipse cx="60" cy="38" rx="55" ry="18" fill="${fill2}" opacity="0.9"/>
    <ellipse cx="40" cy="30" rx="28" ry="20" fill="${fill}"/>
    <ellipse cx="72" cy="28" rx="32" ry="22" fill="${fill}"/>
    <ellipse cx="90" cy="34" rx="20" ry="16" fill="${fill2}"/>
  </svg>`;

  const speed = 0.15 + Math.random() * 0.25;
  const cloudObj = { el: wrapper, x: startX, speed, size, isStorm, top, raining: false };
  state.clouds.push(cloudObj);
  cloudsEl.appendChild(wrapper);

  wrapper.addEventListener('click', () => {
    if (!cloudObj.raining) {
      rainFromCloud(cloudObj);
    }
  });

  // Tooltip
  wrapper.addEventListener('mouseenter', () => {
    tooltip.style.opacity = '1';
    tooltip.textContent = cloudObj.isStorm ? '⛈ Storm Cloud — Click to trigger heavy rain!' : '☁️ Cloud — Click to rain on land';
  });
  wrapper.addEventListener('mouseleave', () => { tooltip.style.opacity = '0'; });
  wrapper.addEventListener('mousemove', (e) => {
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top  = (e.clientY - 24) + 'px';
  });
}

function rainFromCloud(cloudObj) {
  const b = BIOMES[state.biome];
  cloudObj.raining = true;

  const drops = cloudObj.isStorm ? 24 : 12;
  const rainAmount = cloudObj.isStorm ? 18 * b.rainEff : 9 * b.rainEff;
  const rect = cloudObj.el.getBoundingClientRect();
  const groundTop = groundEl.getBoundingClientRect().top;

  for (let i = 0; i < drops; i++) {
    setTimeout(() => {
      const drop = document.createElement('div');
      drop.className = 'rain-drop';
      const dropX = rect.left + Math.random() * rect.width;
      const dropY = rect.bottom;
      const dist = groundTop - dropY + groundEl.clientHeight * 0.5;
      drop.style.height = (cloudObj.isStorm ? 14 : 9) + 'px';
      drop.style.left = dropX + 'px';
      drop.style.top  = dropY + 'px';
      drop.style.position = 'fixed';
      drop.style.background = cloudObj.isStorm ? '#4cc9f0' : '#90e0ef';
      drop.style.setProperty('--drop-dist', dist + 'px');
      drop.style.animationDuration = (0.4 + Math.random()*0.3) + 's';
      document.body.appendChild(drop);
      setTimeout(() => {
        // ripple on ground
        const rip = document.createElement('div');
        rip.className = 'ripple';
        rip.style.left   = (dropX - 10) + 'px';
        rip.style.top    = (groundTop + Math.random()*30) + 'px';
        rip.style.width  = '20px';
        rip.style.height = '20px';
        rip.style.position = 'fixed';
        document.body.appendChild(rip);
        setTimeout(() => { drop.remove(); rip.remove(); }, 600);
      }, 350);
    }, i * 60);
  }

  // Lightning for storms
  if (cloudObj.isStorm) {
    setTimeout(() => {
      flash.style.opacity = '0.6';
      setTimeout(() => { flash.style.opacity = '0'; }, 80);
      setTimeout(() => {
        flash.style.opacity = '0.3';
        setTimeout(() => { flash.style.opacity = '0'; }, 60);
      }, 150);
    }, 200);
  }

  setTimeout(() => {
    state.moisture = Math.min(100, state.moisture + rainAmount);
    state.cloud    = Math.max(0, state.cloud - 15);
    state.vapor    = Math.max(0, state.vapor - 12);
    cloudObj.raining = false;

    // Try to grow a tree
    if (state.moisture > 30 && state.trees.length < BIOMES[state.biome].maxTrees) {
      tryGrowTree();
    }
    // Revive dead trees
    reviveDeadTrees();

    updateHUD();
    updateSkyColor();
  }, drops * 60 + 400);
}

// ===== TREES =====
function makeSvgTree(type, size, alive) {
  const o = alive ? 1 : 0.4;
  const leafCol = alive ? '#2d6a4f' : '#5c4033';
  const trunk   = alive ? '#6b4226' : '#4a3220';

  if (type === 'tree') {
    return `<svg viewBox="0 0 60 80" width="${size}" height="${size*1.3}" xmlns="http://www.w3.org/2000/svg" opacity="${o}">
      <rect x="26" y="55" width="8" height="25" fill="${trunk}"/>
      <polygon points="30,4 8,52 52,52" fill="${leafCol}"/>
      <polygon points="30,16 10,58 50,58" fill="${alive?'#40916c':'#6b4c3b'}"/>
    </svg>`;
  }
  if (type === 'palm') {
    return `<svg viewBox="0 0 60 90" width="${size}" height="${size*1.5}" xmlns="http://www.w3.org/2000/svg" opacity="${o}">
      <path d="M30 80 Q28 50 32 20" stroke="${trunk}" stroke-width="5" fill="none"/>
      <ellipse cx="30" cy="20" rx="22" ry="10" fill="${leafCol}" transform="rotate(-20 30 20)"/>
      <ellipse cx="30" cy="20" rx="22" ry="10" fill="${alive?'#52b788':'#7a5c2e'}" transform="rotate(20 30 20)"/>
      <ellipse cx="30" cy="18" rx="18" ry="8" fill="${leafCol}"/>
    </svg>`;
  }
  if (type === 'cactus') {
    const col = alive ? '#52b788' : '#7a5c2e';
    return `<svg viewBox="0 0 50 80" width="${size*0.8}" height="${size*1.2}" xmlns="http://www.w3.org/2000/svg" opacity="${o}">
      <rect x="20" y="20" width="10" height="60" rx="5" fill="${col}"/>
      <rect x="6"  y="35" width="14" height="8" rx="4" fill="${col}"/>
      <rect x="0"  y="20" width="8"  height="20" rx="4" fill="${col}"/>
      <rect x="30" y="28" width="14" height="8" rx="4" fill="${col}"/>
      <rect x="42" y="14" width="8"  height="22" rx="4" fill="${col}"/>
    </svg>`;
  }
  if (type === 'snowpine') {
    return `<svg viewBox="0 0 60 90" width="${size}" height="${size*1.4}" xmlns="http://www.w3.org/2000/svg" opacity="${o}">
      <rect x="26" y="65" width="8" height="25" fill="${trunk}"/>
      <polygon points="30,5 5,45 55,45" fill="${alive?'#1b4332':'#4a5568'}"/>
      <polygon points="30,25 8,60 52,60" fill="${alive?'#2d6a4f':'#6c757d'}"/>
      <ellipse cx="30" cy="8" rx="12" ry="5" fill="rgba(255,255,255,0.7)"/>
      <ellipse cx="30" cy="28" rx="18" ry="5" fill="rgba(255,255,255,0.5)"/>
    </svg>`;
  }
  // savanna / default
  return `<svg viewBox="0 0 70 70" width="${size*1.1}" height="${size}" xmlns="http://www.w3.org/2000/svg" opacity="${o}">
    <rect x="31" y="42" width="8" height="28" fill="${trunk}"/>
    <ellipse cx="35" cy="30" rx="30" ry="16" fill="${leafCol}"/>
    <ellipse cx="20" cy="35" rx="14" ry="10" fill="${alive?'#40916c':'#5c4033'}"/>
    <ellipse cx="50" cy="35" rx="14" ry="10" fill="${alive?'#40916c':'#5c4033'}"/>
  </svg>`;
}

function spawnInitialTrees() {
  const b = BIOMES[state.biome];
  const count = Math.floor(b.maxTrees * 0.35);
  for (let i = 0; i < count; i++) {
    addTree(true);
  }
}

function addTree(alive) {
  const b = BIOMES[state.biome];
  const el  = document.createElement('div');
  el.style.position = 'absolute';
  el.style.bottom   = '0';
  const x   = 4 + Math.random() * 86;
  const size= 28 + Math.random() * 24;
  el.style.left = x + '%';
  el.innerHTML   = makeSvgTree(b.treeType, size, alive);
  el.style.transition = 'opacity 0.8s';
  groundEl.appendChild(el);

  const treeObj = { el, alive, x, age: 0, size, type: b.treeType };
  state.trees.push(treeObj);
  return treeObj;
}

function tryGrowTree() {
  const b = BIOMES[state.biome];
  if (Math.random() > 0.55) return;
  // Check if there's a dead tree to revive
  const dead = state.trees.find(t => !t.alive);
  if (dead && Math.random() > 0.4) {
    dead.alive = true;
    dead.el.innerHTML = makeSvgTree(dead.type, dead.size, true);
  } else if (state.trees.length < b.maxTrees) {
    addTree(true);
  }
  updateFloraBar();
}

function reviveDeadTrees() {
  state.trees.forEach(t => {
    if (!t.alive && state.moisture > 40 && Math.random() > 0.7) {
      t.alive = true;
      t.el.innerHTML = makeSvgTree(t.type, t.size, true);
    }
  });
  updateFloraBar();
}

function killTrees() {
  // Kill some trees if moisture too low
  const alive = state.trees.filter(t => t.alive);
  if (alive.length === 0) return;
  const victim = alive[Math.floor(Math.random() * alive.length)];
  victim.alive = false;
  victim.el.innerHTML = makeSvgTree(victim.type, victim.size, false);
  updateFloraBar();
}

function updateFloraBar() {
  const b = BIOMES[state.biome];
  const alive = state.trees.filter(t => t.alive).length;
  state.flora = Math.round((alive / b.maxTrees) * 100);
}

// ===== HUD =====
function updateHUD() {
  setBar('moisture', state.moisture);
  setBar('vapor',    state.vapor);
  setBar('cloud',    state.cloud);
  setBar('heat',     state.heat);
  setBar('flora',    state.flora);

  // Phase
  let phase = '💧 Evaporation';
  if (state.cloud > 60)          phase = '⛈ Precipitation';
  else if (state.vapor > 50)     phase = '☁️ Condensation';
  else if (state.moisture > 60)  phase = '🌊 Collection';
  phaseEl.textContent = phase;

  updateSkyColor();
}

function setBar(key, val) {
  document.getElementById('bar-'+key).style.width = Math.round(val)+'%';
  document.getElementById('val-'+key).textContent = Math.round(val);
}

// ===== GAME LOOP =====
function gameLoop() {
  state.tick++;
  const b = BIOMES[state.biome];

  // Natural heat decay
  state.heat = Math.max(b.baseHeat - 5, state.heat - 0.05);

  // Evaporation (heat drives moisture to vapor)
  if (state.heat > 20 && state.moisture > 0) {
    const evap = (state.heat / 100) * 0.15 * b.evapRate;
    state.moisture = Math.max(0, state.moisture - evap);
    state.vapor    = Math.min(100, state.vapor + evap * 1.2);
  }

  // Condensation (vapor → clouds)
  if (state.vapor > 55) {
    state.cloud = Math.min(100, state.cloud + 0.08);
    if (state.tick % 300 === 0 && state.clouds.length < 5) spawnCloud();
  }

  // Storm threshold
  state.stormMode = state.cloud > 80;

  // Natural rain (slow drip)
  if (state.cloud > 60 && state.tick % 200 === 0) {
    state.moisture = Math.min(100, state.moisture + 3 * b.rainEff);
    state.cloud    = Math.max(0, state.cloud - 4);
    state.vapor    = Math.max(0, state.vapor - 3);
  }

  // Tree death if drought
  if (state.moisture < 8 && state.tick % 400 === 0) {
    killTrees();
  }

  // Auto-grow if conditions right
  if (state.moisture > 50 && state.tick % 500 === 0) {
    const b2 = BIOMES[state.biome];
    if (state.trees.length < b2.maxTrees) tryGrowTree();
  }

  // Move clouds
  state.clouds.forEach((c, idx) => {
    c.x += c.speed;
    c.el.style.left = c.x + 'px';
    if (c.x > window.innerWidth + 50) {
      c.el.remove();
      state.clouds.splice(idx, 1);
    }
  });

  // Spawn new cloud if needed
  if (state.cloud > 40 && state.clouds.length < 3 && state.tick % 180 === 0) {
    spawnCloud();
  }

  // Remove excess clouds if cloud level drops
  if (state.cloud < 15 && state.clouds.length > 1 && state.tick % 300 === 0) {
    const c = state.clouds.pop();
    c.el.style.opacity = '0';
    setTimeout(() => c.el.remove(), 500);
  }

  // Clamp all values
  state.moisture = Math.max(0, Math.min(100, state.moisture));
  state.vapor    = Math.max(0, Math.min(100, state.vapor));
  state.cloud    = Math.max(0, Math.min(100, state.cloud));
  state.heat     = Math.max(0, Math.min(100, state.heat));

  updateHUD();
  requestAnimationFrame(gameLoop);
}

// ===== BIOME BUTTONS =====
document.querySelectorAll('.biome-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.biome-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyBiome(btn.dataset.biome);
  });
});

// ===== START =====
init();
</script>
</body>
